name: memory-mcp-validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    # H-02 (docs/auditoria-tecnica-integral.md): antes tenia continue-on-error: true
    # a nivel de job, lo que volvia no-bloqueante tanto la validacion de .mcp.json
    # como el escaneo de secretos. Se retira para que ambos checks bloqueen el merge.
    steps:
      - uses: actions/checkout@v4
      - name: Validate .mcp.json is valid JSON
        run: python3 -c "import json; json.load(open('.mcp.json'))"
      - name: Run scan_secrets tests
        run: python3 tests/test_scan_secrets.py
      - name: Scan repo for obvious secret patterns
        # H-03: antes solo escaneaba .claude/memory/knowledge-graph.jsonl. Ahora usa
        # scripts/scan_secrets.py, que recorre todo el arbol versionado por git.
        run: python3 scripts/scan_secrets.py
